name: Update current football season
on:
  schedule:
    # GitHub cron uses UTC. Check both possible UK 08:15 UTC offsets;
    # the first job step accepts only the schedule matching today's UK offset.
    - cron: '15 7 * * *'
    - cron: '15 8 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-data-current-season
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMPORT_TOKEN: ${{ secrets.EDGELAB_IMPORT_TOKEN }}
    steps:
      - name: Use 08:15 UK time in both GMT and BST
        id: uk_schedule
        shell: bash
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, os, zoneinfo
          now=datetime.datetime.now(datetime.timezone.utc)
          uk=now.astimezone(zoneinfo.ZoneInfo('Europe/London'))
          expected='15 7 * * *' if uk.utcoffset().total_seconds()==3600 else '15 8 * * *'
          run=os.environ.get('EVENT_NAME')=='workflow_dispatch' or os.environ.get('SCHEDULE_EXPRESSION')==expected
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
            output.write('run_import='+('true' if run else 'false')+'\\n')
          print('UK date:',uk.date(),'Offset:',uk.utcoffset(),'Trigger:',os.environ.get('SCHEDULE_EXPRESSION'),'Import:',run)
          PY
      - name: Check importer credentials
        if: steps.uk_schedule.outputs.run_import == 'true'
        shell: bash
        run: |
          if [ -z "$IMPORT_TOKEN" ]; then
            echo "::error::Set EDGELAB_IMPORT_TOKEN in GitHub Actions secrets to match the Supabase Edge Function secret."
            exit 1
          fi
      - name: Import current 2026-27 season
        if: steps.uk_schedule.outputs.run_import == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = 'https://hdueztssmsvvxkwqgcnm.supabase.co/functions/v1/import-football-data'
          payload = json.dumps({'season':'2627'}).encode()
          req = urllib.request.Request(url, data=payload, method='POST', headers={
            'Content-Type':'application/json',
            'x-edgelab-import-token':os.environ['IMPORT_TOKEN']
          })
          try:
            with urllib.request.urlopen(req, timeout=600) as response:
              result=json.load(response)
          except urllib.error.HTTPError as exc:
            raise SystemExit(f'Importer HTTP {exc.code}: {exc.read(500).decode(errors="replace")}')
          rows=result.get('summary',[])
          failures=[r for r in rows if 'error' in r]
          successes=[r for r in rows if 'error' not in r]
          latest=max((r.get('latest_result_date') or '' for r in successes),default='')
          recent=sum(r.get('results_last_7_days',0) for r in successes)
          report={
            'season':'2627',
            'leagues':len(rows),
            'matches_upserted':sum(r.get('saved',0) for r in successes),
            'latest_result_date':latest or None,
            'results_last_7_days':recent,
            'league_details':rows,
            'failures':failures,
          }
          print(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
            summary.write('## Gerball football results import\\n')
            summary.write(f"- Latest completed match: **{latest or 'none'}**\\n")
            summary.write(f"- Results dated within the last 7 days: **{recent}**\\n")
            summary.write(f"- Leagues processed: **{len(rows)}**; failures: **{len(failures)}**\\n")
            if failures:
              summary.write('\\n### Failed leagues\\n')
              for r in failures:
                summary.write(f"- {r.get('league','unknown')}: {r.get('error','unknown error')}\\n")
          if len(rows)!=21 or failures:
            raise SystemExit('Incomplete import: expected all 21 leagues without errors')
          if not latest:
            raise SystemExit('Importer returned no completed matches; investigate source feed')
          PY
