name: Validate Gerball frontend
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline scripts and required navigation
        run: node scripts/check-site.cjs
      - name: Verify historical request coalescing, freshness and cache limits
        run: node --test scripts/check-historical-request-cache.mjs
      - name: Verify selected-market summaries, chronology and CSV exports
        run: node --test scripts/check-walkforward-calculations.mjs scripts/check-walkforward-panel.mjs
      - name: Verify research CSV bytes, captured settings and report request lifecycle
        run: node --test scripts/check-research-report-state.mjs scripts/check-research-audit.mjs
      - name: Verify deployed research reports and archive coverage queries
        run: node scripts/check-live-research-reports.mjs
      - name: Verify daily odds collection, authentication and UK clock changes
        run: node --test scripts/check-odds-collector.mjs
      - name: Verify upcoming fixtures, public endpoint and team aliases
        run: node --test scripts/check-upcoming-endpoint.mjs scripts/check-upcoming-ui.mjs scripts/check-upcoming-bridge.mjs scripts/check-upcoming-lifecycle.mjs scripts/check-team-aliases.mjs
      - name: Verify captured prices, fixture identity and dialog lifecycle
        run: node --test scripts/check-captured-prices-ui.mjs
      - name: Verify historical fixture analysis and sample handling
        run: node --test scripts/check-fixture-analysis-endpoint.mjs scripts/check-fixture-analysis-ui.mjs
      - name: Verify historical strategy screening and price-independent qualification
        run: node --test scripts/check-strategy-screen-endpoint.mjs scripts/check-strategy-screen-ui.mjs scripts/check-strategy-screen-bridge.mjs
      - name: Reconcile the deployed historical screen and captured prices
        run: node scripts/check-live-strategy-screen.mjs
      - name: Verify recorded research screens and immutable observation display
        run: node --test scripts/check-recorded-screens-endpoint.mjs scripts/check-recorded-screens-ui.mjs scripts/check-recorded-screens-bridge.mjs
      - name: Verify deployed recorded screens and saved cohort replay
        run: node scripts/check-live-recorded-screens.mjs
      - name: Verify data status, read-only access and coverage display
        run: node --test scripts/check-data-status-endpoint.mjs scripts/check-data-status-ui.mjs scripts/check-data-status-bridge.mjs
      - name: Verify deployed data status and server-only database access
        run: node scripts/check-live-data-status.mjs
      - name: Verify surebet stake allocation, market completeness and live feed
        run: node scripts/check-live-surebets.cjs
      - name: Verify extended bookmaker markets, provider costs and authentication
        run: node scripts/check-live-extra-markets.mjs
      - name: Verify paper bet clock changes, visibility, refresh and request races
        run: node --test scripts/check-paper-bets-endpoint.mjs scripts/check-paper-bets-lifecycle.mjs
      - name: Verify P&L dashboard totals, calendar and read-only endpoint
        run: node --test scripts/check-paper-dashboard-math.mjs scripts/check-paper-dashboard-endpoint.mjs
      - name: Verify isolated today-first bookmaker price comparisons
        run: node scripts/check-live-paper-refreshed-prices.mjs
      - name: Verify saved-price movements and modeled follow-up edge
        run: node scripts/check-live-paper-odds-movement.mjs
      - name: Verify paper coverage scopes, market gaps and report failure handling
        run: node --test scripts/check-paper-coverage.mjs
      - name: Verify paper recommendations, unit staking and P&L ledger
        run: node scripts/check-live-paper-bets.mjs
      - name: Reconcile live historical league-market benchmarks
        run: node scripts/check-live-benchmarks.cjs
